<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - AIO Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2D1B69 0%, #1E1145 100%);
            color: white;
        }

        .nav-bar {
            background: transparent;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            color: #9C27B0;
            font-size: 1.8rem;
        }

        .cart-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details {
            flex-grow: 1;
            margin: 0 2rem;
        }

        .item-title {
            font-size: 1.2rem;
            color: #9C27B0;
        }

        .item-price {
            font-size: 1.1rem;
            color: white;
            margin-top: 0.5rem;
        }

        .remove-btn {
            background: #9C27B0;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-summary {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .total {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            background: #673AB7;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
        }

        .empty-cart {
            text-align: center;
            margin-top: 4rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="logo">
            <h1>AIO GAMES</h1>
        </div>
        <div class="nav-links">
            <a href="GAMINGHUB2.HTML">Back to Store</a>
        </div>
    </nav>

    <div class="cart-container">
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <div id="cartSummary" class="cart-summary">
            <div class="total">Total: $<span id="cartTotal">0.00</span></div>
            <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Payment</button>
        </div>
    </div>

    <script>
        function loadCart() {
            const cartItems = document.getElementById('cartItems');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Your cart is empty</div>';
                return;
            }

            cartItems.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += parseFloat(item.price);
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="item-details">
                            <div class="item-title">${item.title}</div>
                            <div class="item-price">$${item.price}</div>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </div>
                `;
            });

            document.getElementById('cartTotal').textContent = total.toFixed(2);
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        function proceedToCheckout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            window.location.href = 'PAYMENT.HTML';
        }

        // Load cart when page loads
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
