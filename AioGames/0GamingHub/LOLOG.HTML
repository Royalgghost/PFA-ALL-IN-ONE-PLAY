<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIO Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0            querySelectorAll    .0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2D1B69 0%, #1E1145 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #9C27B0, #673AB7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #9C27B0;
            box-shadow: 0 0 10px rgba(156, 39, 176, 0.3);
        }
        
        .login-button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, #9C27B0, #673AB7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(156, 39, 176, 0.4);
        }
        
        .additional-options {
            margin-top: 1.5rem;
            text-align: center;
        }
        
        .additional-options a {
            color: #9C27B0;
            text-decoration: none;
            margin: 0 10px;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .additional-options a:hover {
            color: #673AB7;
        }
        
        .social-login {
            margin-top: 2rem;
            text-align: center;
        }
        
        .social-login p {
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }
        
        .social-icons a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .social-icons a:hover {
            transform: translateY(-3px);
            background: #9C27B0;
        }
        
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        
        .back-to-home:hover {
            color: #9C27B0;
        }
        
        .back-to-main-site {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.3), rgba(103, 58, 183, 0.3));
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .back-to-main-site:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.4), rgba(103, 58, 183, 0.4));
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <a href="../../../index.html" class="back-to-main-site">
        <i class="fas fa-home"></i> Back to AIO Hub
    </a>
    <a href="GAMINGHUB2.HTML" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-container">
        <div class="login-header">
            <h1>AIO Games</h1>
            <p>Welcome back, gamer!</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="login-button">Login</button>
        </form>

        <div class="additional-options">
            <a href="#">Forgot Password?</a>
            <a href="REGISTER.HTML">Sign Up</a>
        </div>

        <div class="social-login">
            <p>Or login with</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-google"></i></a>
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Get stored users
            const users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check for admin login
            if(username === 'admin@gmail.com' && password === 'admin123') {
                const adminUser = {
                    username: "admin",
                    email: username,
                    isAdmin: true
                };
                localStorage.setItem('loggedInUser', JSON.stringify(adminUser));
                window.location.href = 'ADMIN.HTML';
                return;
            }
            
            // Check for regular user login
            const user = users.find(u => (u.email === username || u.username === username) && u.password === password);
            
            if(user) {
                // Add isAdmin flag to user object
                user.isAdmin = false;
                localStorage.setItem('loggedInUser', JSON.stringify(user));
                window.location.href = 'GAMINGHUB2.HTML';
            } else {
                alert('Invalid username or password!');
            }
        });

        // Check if user is already logged in
        window.onload = function() {
            const loggedInUser = JSON.parse(localStorage.getItem('loggedInUser'));
            if (loggedInUser) {
                if (loggedInUser.isAdmin) {
                    window.location.href = 'ADMIN.HTML';
                } else {
                    window.location.href = 'GAMINGHUB2.HTML';
                }
            }
        }
    </script>
</body>

</html>
